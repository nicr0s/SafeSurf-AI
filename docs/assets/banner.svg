    <radialGradient id="glow"><stop stop-color="#194d55" stop-opacity=".6"/><stop offset="1" stop-color="#194d55" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cce7f4" stroke-opacity=".035"/></pattern>
  </defs>
