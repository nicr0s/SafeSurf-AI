<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">SafeSurf AI</title>
  <desc id="desc">Local machine learning for phishing URL detection. A diploma research prototype, Astana IT University, 2025.</desc>
