name: Bug report
description: Report an API, model, browser, setup, or documentation problem.
title: "[Bug] "
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Model or API
        - Browser extension
        - Installation or Docker
        - Documentation
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the problem and include reproduction steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python and library versions, browser version, or Docker setup.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Add request/response examples, logs, or screenshots. Remove private URL query values and credentials.
